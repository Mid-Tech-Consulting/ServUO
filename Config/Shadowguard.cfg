# In seconds, how long the wait until you are teleported into a shadowguard room
# once the encounter begins
ReadyDuration=30

# This flag controls if you start at a random instance (room) in shadowguard,
# or in order starting at the North-West corner. See EncounterBounds Table in
# in Controller.cs.
RandomizeInstances=False

# In hours, how long a player keeps Roof access after completing all 5 rooms.
# During this window, completing the Roof does NOT wipe their room progress,
# so they can re-enter the Roof repeatedly. Once this window lapses, the next
# Roof attempt clears their progress and they must redo all 5 rooms first.
RoofAccessHours=4
